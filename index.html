    <!-- JSON-LD: SoftwareApplication -->

      "applicationCategory": "ProductivityApplication",

      "keywords": "offline first app, personal workspace, notes app, journal app, people contacts, places tracker, private notes, offline note taking",
      "featureList": [
        "Offline-first architecture — works without internet",
        "Store and organise notes locally",
        "Write and track journal entries",
        "Save people's details and contact information",
        "Track places you've visited with notes and photos",
        "End-to-end local encryption",

      ],

        {
          "@type": "Offer",

        {

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />
    <title>Chronovah</title>
    <!-- Paystack inline popup — defer so it doesn't block page render -->
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
    <style>
      /* ── Loader styles inlined so they apply before any bundle loads ── */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        transition: opacity 0.35s ease;
      }
      .dark #app-loader { background-color: #0b1120; }
      #app-loader.hidden { opacity: 0; pointer-events: none; }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .loader-logo-wrap { }

      .loader-logo {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: loader-spin 1.2s linear infinite;
      }

      /* Light mode: show logo-light, Dark mode: show logo-dark */
      .loader-logo-img-light { display: block; }
      .loader-logo-img-dark  { display: none; }
      .dark .loader-logo-img-light { display: none; }
      .dark .loader-logo-img-dark  { display: block; }

      @keyframes loader-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <script>
      // Apply saved theme immediately before React renders
      (function () {
        const theme = localStorage.getItem('chronovah-theme') || 'ocean';
        if (theme !== 'ocean') {
          document.documentElement.classList.add('theme-' + theme);
        }
        // Apply dark mode immediately
        const dark = localStorage.getItem('isDarkMode');
        if (dark === 'true') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Initial app loader — removed once React mounts -->
    <div id="app-loader" aria-hidden="true">
      <div class="loader-content">
        <!-- Spinning logo — light/dark handled via CSS class on <html> -->
        <div class="loader-logo-wrap">
          <div class="loader-logo">
            <img
              src="/logo-light.png"
              alt="Chronovah"
              class="loader-logo-img-light"
              style="width:64px;height:64px;object-fit:contain;"
            />
            <img
              src="/logo-dark.png"
              alt="Chronovah"
              class="loader-logo-img-dark"
              style="width:64px;height:64px;object-fit:contain;"
            />
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
